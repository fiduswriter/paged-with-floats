<style>

	display: flex;
	gap: 10px;
	align-items: center;
	flex: none;

#toolbar button {
	padding: 7px 14px; border: 0; border-radius: 6px;
	background: #4a90d9; color: white; cursor: pointer; font-size: 14px;

#toolbar button:disabled { background: #777; cursor: wait; }
#toolbar button.secondary { background: #666; }

#main { flex: 1; display: flex; min-height: 0; }

	width: 38%; min-width: 320px; display: flex; flex-direction: column;
	border-right: 1px solid #ccc; background: white;
}
#editor-label {
	padding: 6px 10px; font-size: 12px; color: #555;
	background: #ececec; border-bottom: 1px solid #ddd; flex: none;
}
#source {
	flex: 1; border: 0; resize: none; padding: 10px;
	font-family: ui-monospace, Menlo, Consolas, monospace;
	font-size: 11.5px; line-height: 1.45; outline: none; white-space: pre;
}
#output-pane { flex: 1; overflow: auto; padding: 16px; background: #525659; }
.paged_pages { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.paged_page { background: white; box-shadow: 0 2px 8px rgba(0,0,0,.4); }

<body>
<div id="toolbar">
	<button id="render-btn">Render pages</button>
	<button id="pdf-btn" class="secondary">Download PDF</button>
	<span id="status">Edit the source on the left, then render.</span>
</div>
<div id="main">
	<div id="editor-pane">
		<div id="editor-label">HTML source (editable — CSS included)</div>
		<textarea id="source" spellcheck="false"></textarea>
	</div>
	<div id="output-pane"><div id="output"></div></div>
</div>

<script id="demo-default-source" type="text/plain"><!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>The Malay Archipelago — floats in multicol</title>
	<style>
		/* Book CSS. Its root-level `body { column-count }` is captured by
		   the polisher and realized as the page wrappers' columns; the
		   host document itself must never become a multicol container. */
		body {
			column-count: 2;
			column-gap: 10mm;
			font-family: serif;
		}

		@page {
			size: 190mm 250mm;
			margin: 20mm;

			@top-center {
				content: string(chapter);
				font-size: 0.8em;
				font-style: italic;
			}
			@bottom-center {
				content: counter(page);
				font-size: 0.8em;
			}
		}

		h2 {
			string-set: chapter content();
			margin-top: 0;
			break-after: avoid;
		}

		/* … with page floats: figures are pulled to the top of the page
		   their anchor appears on, spanning the full page width across
		   both columns, while column text continues beneath them. */
		figure.topfloat {
			float-reference: page;
			float: top;
			float-min-wrap-block: 40mm;
			margin: 0 0 10px 0;
			text-align: center;
		}
		figcaption {
			font-size: 0.85em;
			font-style: italic;
			margin-top: 6px;
		}

		/* Footnotes collect at the bottom of the page, below all columns. */
		.footnote {
			float: footnote;
			font-size: 0.8em;
		}
		::footnote-call {
			font-size: 0.7em;
			vertical-align: super;
		}
		::footnote-marker {
			font-weight: bold;
		}

		p {
			text-align: justify;
			hyphens: auto;
		}
	</style>

</head>
<body>
<span class="topfloat figure-wrap"><figure class="topfloat">
	<img src="assets/images/map-of-malay-archipelago-wallace-1869.jpg" alt="Wallace's map" style="max-width: 100%;">
	<figcaption>Fold-out coloured map at front of book, showing Wallace's travels around the archipelago.</figcaption>
</figure></span>

<h1>The Malay Archipelago</h1>

<p><i><b>The Malay Archipelago</b></i> is a book by the British naturalist <i>Alfred Russel Wallace</i> that chronicles his scientific exploration, during the eight-year period 1854 to 1862, of the southern portion of the <i>Malay Archipelago</i> including <i>Malaysia</i>, <i>Singapore</i>, the islands of <i>Indonesia</i>, then known as the <i>Dutch East Indies</i>, and the island of <i>New Guinea</i>. It was published in two volumes in 1869, delayed by Wallace's ill health and the work needed to describe the many specimens he brought home.<span class="footnote"><span>Wallace, 1869. pp. vii–ix.</span></span> The book went through ten editions in the nineteenth century; it has been reprinted many times since, and has been translated into at least eight languages.</p>

<h2>Context</h2>

<p>In 1847, Wallace and his friend <i>Henry Walter Bates</i>, both in their early twenties,<span class="footnote"><span>Bates was 22, Wallace was 24.</span></span> agreed that they would jointly make a collecting trip to the Amazon "towards solving the problem of origin of species";<span class="footnote"><span>Mallet, Jim. "Henry Walter Bates". University College London. Retrieved December 11, 2012.</span></span> <i>Charles Darwin</i>'s book on the <i>Origin of Species</i> was not published until 11 years later, in 1859, itself precipitated by a famous letter from Wallace which described the theory of natural selection in outline. They had been inspired by reading the American <i>entomologist</i> <i>William Henry Edwards</i>'s pioneering 1847 book <i>A Voyage Up the River Amazon</i>.<span class="footnote"><span>Edwards, 1847.</span></span> Bates stayed in the Amazons for 11 years, going on to write <i>The Naturalist on the River Amazons</i> (1863); Wallace, ill with fever, went home in 1852 with thousands of specimens, some for science and some for sale. The ship and his collection were destroyed by fire at sea near the Guianas. Rather than giving up, Wallace wrote about the Amazon in both prose and poetry, and then set sail again, this time for the Malay Archipelago.<span class="footnote"><span>Edwards, 1847.</span></span></p>

<h2>Publication</h2>

<p><i>The Malay Archipelago</i> was first published in 1869 in two volumes by Macmillan (London), and the same year in one volume by Harper &amp; Brothers (New York). Wallace returned to England in 1862, but explains in the Preface that given the large quantity of specimens and his poor health after his stay in the tropics, it took a long time. He noted that he could at once have printed his notes and journals, but felt that doing that would have been disappointing and unhelpful. Instead, therefore, he waited until he had published papers on his discoveries, and other scientists had described and named as new species some 2,000 of his beetles (<i>Coleoptera</i>), and over 900 <i>Hymenoptera</i> including 200 new species of <i>ant</i>.<span class="footnote"><span>Wallace, 1869. pp. vii–ix.</span></span> The book went through 10 editions, with the last published in 1890.</p>

<h2>Illustrations</h2>

<span class="topfloat figure-wrap"><figure class="topfloat">
	<img src="assets/images/malay-archipelago-great-shielded-grasshopper.jpg" alt="Great-shielded Grasshopper" style="max-width: 70%;">
	<figcaption>"Great-shielded Grasshopper" drawn and signed by <i>E. W. Robinson</i>.</figcaption>
</figure></span>

<p>The illustrations are, according to the <i>Preface</i>, made from Wallace's own sketches, photographs, or specimens. Wallace thanks Walter and Henry Woodbury for some photographs of scenery and native people. He acknowledges William Wilson Saunders and Mr Pascoe for horned flies and very rare Longhorn beetles: all the rest were from his own enormous collection.</p>

<h2>Overview</h2>

<p>The preface summarizes Wallace's travels, the thousands of specimens he collected, and some of the results from their analysis after his return to <i>England</i>. In the preface he notes that he travelled over 14,000 miles and collected 125,660 specimens, mostly of <i>insects</i>: 83,200 <i>beetles</i>, 13,100 <i>butterflies and moths</i>, 13,400 other insects. He also returned to England 7,500 "shells" (such as <i>molluscs</i>), 8,050 <i>birds</i>, 310 <i>mammals</i> and 100 <i>reptiles</i>.<span class="footnote"><span>Wallace, 1869. p. xiv.</span></span></p>

<p>The book is dedicated to <i>Charles Darwin</i>, but as Wallace explains in the preface, he has chosen to avoid discussing the <i>evolutionary</i> implications of his discoveries. Instead he confines himself to the "interesting facts of the problem, whose solution is to be found in the principles developed by Mr. Darwin", so from a scientific point of view, the book is largely a descriptive <i>natural history</i>. This modesty belies the fact that while in <i>Sarawak</i> in 1855 Wallace wrote the paper <i>On the Law which has Regulated the Introduction of New Species</i>, concluding with the evolutionary "Sarawak Law", three years before he fatefully wrote to Darwin proposing the concept of <i>natural selection</i>.<span class="footnote"><span>Wallace, Alfred Russel (1855). "On the Law Which has Regulated the Introduction of New Species".</span></span></p>

<p>The first chapter describes the <i>physical geography</i> and <i>geology</i> of the islands with particular attention to the role of <i>volcanoes</i> and earthquakes. It also discusses the overall pattern of the flora and fauna including the fact that the islands can be divided, by what would eventually become known as the <i>Wallace line</i>, into two parts, those whose animals are more closely related to those of Asia and those whose fauna is closer to that of Australia.</p>

<p>The following chapters describe in detail the places Wallace visited. Wallace includes numerous observations on the people, their languages, ways of living, and social organization, as well as on the plants and animals found in each location. He talks about the <i>biogeographic</i> patterns he observes and their implications for <i>natural history</i>, in terms both of the movement of species<span class="footnote"><span>Implying <i>adaptive radiation</i>.</span></span> and of the geologic history of the region. He also narrates some of his personal experiences during his travels. The final chapter is an overview of the ethnic, linguistic, and cultural divisions among the people who live in the region and speculation about what such divisions might indicate about their history.</p>
</body>
</html>
</script>
<script>
(function () {
	const template = document.getElementById("demo-default-source");
	const source = document.getElementById("source");
	source.value = template.textContent.trim() + "\n";

	function setStatus(text) {
		document.getElementById("status").textContent = text;
	}

	async function currentSource() {
		return source.value.replace(DemoUI.POLYFILL_TAG_RE, "");
	}

	async function renderPages() {
		const button = document.getElementById("render-btn");
		button.disabled = true;
		setStatus("Rendering…");
		const output = document.getElementById("output");
		output.innerHTML = "";
		try {
			const previewer = new window.Paged.Previewer();
			// Parse to a fragment: the chunker needs DOM input, and
			// <style> elements inside the fragment still apply.
			const template = document.createElement("template");
			template.innerHTML = await currentSource();
			const flow = await previewer.preview(template.content, [], output);
			await previewer.hooks.afterPreview.trigger(flow.pages);
			setStatus(flow.total + " pages rendered in " +
				Math.round(flow.performance) + " ms" +
				(flow.overflowViolations && flow.overflowViolations.length
					? " — " + flow.overflowViolations.length + " overflow violation(s)!"
					: ""));
		} catch (error) {
			setStatus("Rendering failed: " + error.message);
			console.error(error);
		} finally {
			button.disabled = false;
		}
	}

	async function downloadPdf() {
		const button = document.getElementById("pdf-btn");
		button.disabled = true;
		const original = button.textContent;
		button.textContent = "Generating PDF…";
		setStatus("Generating PDF…");
		try {
			const bytes = await DemoUI.generatePdf(
				await currentSource(),
				{ title: "The Malay Archipelago — floats in multicol" },
			);
			DemoUI.saveBytes(bytes, "malay-archipelago.pdf");
			setStatus("PDF downloaded (" + Math.round(bytes.length / 1024) + " KB)");
		} catch (error) {
			setStatus("PDF generation failed: " + error.message);
			console.error(error);
		} finally {
			button.disabled = false;
			button.textContent = original;
		}
	}

	document.getElementById("render-btn").addEventListener("click", () => {
		renderPages().catch((e) => setStatus(String(e)));
	});
	document.getElementById("pdf-btn").addEventListener("click", () => {
		downloadPdf().catch((e) => setStatus(String(e)));
	});

	// Render once on load so the right side is never empty.
	window.addEventListener("DOMContentLoaded", () => {
		renderPages().catch((e) => setStatus(String(e)));
	});
})();
</script>
</body>
</html>
